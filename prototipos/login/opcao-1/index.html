<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · opção 1 (Cartão claro)</title>
<!-- Base: "Clean & Minimal Sign In" (HextaUI, Preet Suthar) https://21st.dev/@preetsuthar17/components/clean-minimal-sign-in -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../base.css">
<style>
  /* Fundo cinza da Névoa com uma luz azul bem leve atrás do cartão */
  body { display: grid; place-items: center; padding: var(--s-24) var(--s-16);
    background: radial-gradient(900px 560px at 50% 30%, rgb(0 100 204 / 0.10), transparent 70%), var(--fundo); }
  .cartao {
    width: min(100%, 400px); display: flex; flex-direction: column; align-items: center; gap: var(--s-24);
    padding: var(--s-32); border-radius: var(--raio-bloco); border: 1px solid rgb(255 255 255 / 0.9);
    background: linear-gradient(180deg, #EAF2FC 0%, var(--sup) 42%); box-shadow: var(--sombra-alta);
    animation: subir var(--dur-lenta) var(--curva) both;
  }
  .selo { display: grid; place-items: center; width: 60px; height: 60px; border-radius: var(--raio-c); background: var(--sup); box-shadow: var(--sombra); }
  .selo img { width: auto; height: 32px; }
  .topo { display: flex; flex-direction: column; align-items: center; gap: var(--s-8); text-align: center; }
  .topo h1 { font-size: var(--t-25); }
  .topo p { max-width: 30ch; color: var(--fraco); font-size: var(--t-14); }
  form { width: 100%; display: flex; flex-direction: column; gap: var(--s-12); }
  .campo { position: relative; display: block; }
  .campo svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; translate: 0 -50%; fill: none; stroke: var(--fraco); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; transition: stroke var(--dur-rapida) var(--curva); }
  .campo input {
    width: 100%; height: 44px; padding: 0 var(--s-12) 0 42px; border: 1px solid var(--borda); border-radius: var(--raio-b);
    background: var(--sup-2); color: var(--texto); font: 400 var(--t-16) / 1 var(--fonte);
    transition: background-color var(--dur-rapida) var(--curva), border-color var(--dur-rapida) var(--curva);
  }
  .campo input::placeholder { color: var(--fraco); }
  .campo input:focus { background: var(--sup); }
  .campo:focus-within svg { stroke: var(--azul); }
  form .btn { margin-top: var(--s-4); background: linear-gradient(180deg, #1A7BE0 0%, var(--azul) 100%); }
  form .btn:hover { background: var(--azul-hover); }
  .marca-nome { font: 600 var(--t-14) / 1 var(--fonte); color: var(--fraco); letter-spacing: 0.02em; }
  @media (max-width: 480px) { .cartao { padding: var(--s-24); } }
</style>
</head>
<body>
  <main class="cartao">
    <div class="selo"><img src="../../../public/marca/fivecon.png" alt=""></div>
    <div class="topo">
      <p class="marca-nome">Tarefas</p>
      <h1>Entrar</h1>
      <p>Só entra quem foi convidado. Esqueceu a senha? Peça um novo convite ao Natham.</p>
    </div>
    <form onsubmit="event.preventDefault()">
      <label class="campo"><span class="vh">E-mail</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <input type="email" name="email" autocomplete="username" placeholder="E-mail" required>
      </label>
      <label class="campo"><span class="vh">Senha</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <input type="password" name="senha" autocomplete="current-password" placeholder="Senha" required>
      </label>
      <button type="submit" class="btn">Entrar</button>
    </form>
  </main>
</body>
</html>
