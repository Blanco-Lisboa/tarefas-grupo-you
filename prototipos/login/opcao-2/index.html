<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · opção 2 (Painel azul)</title>
<!-- Base: "Sign In" (EaseMize UI, Hossain Jahed) https://21st.dev/@jahed/components/sign-in
     A foto colorida do original virou um painel azul da Névoa feito só com CSS (faixas de luz que se movem devagar). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../base.css">
<style>
  body { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-16); padding: var(--s-16); background: var(--sup); }
  .lado { position: relative; display: grid; place-items: center; padding: var(--s-64) var(--s-24); }
  .lado .marca { position: absolute; top: var(--s-16); left: var(--s-16); }
  .form-caixa { width: min(100%, 420px); display: flex; flex-direction: column; gap: var(--s-32); }
  .anim { animation: subir var(--dur-lenta) var(--curva) both; animation-delay: calc(var(--i, 0) * 80ms); }
  h1 { font-size: var(--t-49); letter-spacing: -0.045em; }
  form { display: flex; flex-direction: column; gap: var(--s-16); }
  .campo { display: flex; flex-direction: column; gap: var(--s-8); font-size: var(--t-14); font-weight: 500; color: var(--fraco); }
  .caixa { position: relative; }
  .caixa input {
    width: 100%; height: 52px; padding: 0 var(--s-16); border: 1px solid var(--borda); border-radius: var(--raio-c);
    background: var(--sup-2); color: var(--texto); font: 400 var(--t-16) / 1 var(--fonte);
    transition: background-color var(--dur-rapida) var(--curva), border-color var(--dur-rapida) var(--curva);
  }
  .caixa input:hover { border-color: #B9B9C0; }
  .caixa input:focus { background: var(--sup); }
  .caixa input[name="senha"] { padding-right: 52px; }
  .olho { position: absolute; right: 6px; top: 50%; translate: 0 -50%; display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: var(--raio-b); background: none; color: var(--fraco); cursor: pointer; }
  .olho:hover { background: var(--realce); color: var(--texto); }
  .olho svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .olho .fechado, .olho[aria-pressed="true"] .aberto { display: none; }
  .olho[aria-pressed="true"] .fechado { display: block; }
  form .btn { height: 52px; margin-top: var(--s-8); border-radius: var(--raio-c); font-size: var(--t-16); }

  /* Painel azul: base em degradê + faixas de luz diagonais desfocadas que deslizam */
  .painel {
    position: relative; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; padding: var(--s-32);
    border-radius: 28px; background: linear-gradient(140deg, #003B85 0%, var(--azul) 45%, #2E86EA 75%, #8DBBF2 100%);
    animation: subir var(--dur-lenta) var(--curva) both;
  }
  .painel::before, .painel::after { content: ""; position: absolute; inset: -40%; pointer-events: none; }
  .painel::before {
    background: repeating-linear-gradient(118deg, transparent 0 70px, rgb(214 232 255 / 0.65) 110px, rgb(255 255 255 / 0.9) 122px, transparent 170px 260px);
    filter: blur(14px); mix-blend-mode: soft-light; animation: deriva 22s ease-in-out infinite alternate;
  }
  .painel::after {
    background: radial-gradient(40% 35% at 75% 20%, rgb(255 255 255 / 0.35), transparent 70%),
      radial-gradient(45% 40% at 15% 85%, rgb(0 30 90 / 0.45), transparent 70%);
    animation: deriva 30s ease-in-out infinite alternate-reverse;
  }
  @keyframes deriva { to { transform: translate3d(8%, -6%, 0) rotate(4deg); } }
  .vidro {
    position: relative; z-index: 1; width: min(100%, 440px); display: flex; gap: var(--s-16); align-items: flex-start;
    padding: var(--s-24); border-radius: var(--raio-v); border: 1px solid rgb(255 255 255 / 0.4);
    background: rgb(255 255 255 / 0.16); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
    color: var(--no-azul); box-shadow: 0 16px 40px -20px rgb(0 30 90 / 0.6);
    animation: subir var(--dur-lenta) var(--curva) 320ms both;
  }
  .vidro .selo { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--sup); }
  .vidro .selo img { height: 24px; width: auto; }
  .vidro strong { display: block; font-size: var(--t-16); font-weight: 600; }
  .vidro p { color: var(--no-azul-fraco); font-size: var(--t-14); }

  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; gap: var(--s-8); padding: var(--s-12); }
    .lado { padding: var(--s-64) var(--s-12) var(--s-24); }
    .lado .marca { top: var(--s-12); left: var(--s-12); }
    h1 { font-size: var(--t-39); }
    .painel { min-height: 240px; padding: var(--s-16); border-radius: var(--raio-bloco); }
    .vidro { padding: var(--s-16); }
  }
</style>
</head>
<body>
  <main class="lado">
    <div class="marca anim"><img src="../../../public/marca/fivecon.png" alt=""><span>Tarefas</span></div>
    <div class="form-caixa">
      <h1 class="anim" style="--i:1">Entrar</h1>
      <form onsubmit="event.preventDefault()">
        <label class="campo anim" style="--i:2">E-mail
          <span class="caixa"><input type="email" name="email" autocomplete="username" placeholder="seu@email.com" required></span>
        </label>
        <div class="campo anim" style="--i:3"><label for="senha">Senha</label>
          <span class="caixa">
            <input id="senha" type="password" name="senha" autocomplete="current-password" placeholder="Sua senha" required>
            <button type="button" class="olho" aria-label="Mostrar senha" aria-pressed="false"
              onclick="const s=document.getElementById('senha'),v=s.type==='password';s.type=v?'text':'password';this.setAttribute('aria-pressed',v);this.setAttribute('aria-label',v?'Esconder senha':'Mostrar senha')">
              <svg class="aberto" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="fechado" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </span>
        </div>
        <button type="submit" class="btn anim" style="--i:4">Entrar</button>
      </form>
    </div>
  </main>
  <aside class="painel">
    <div class="vidro">
      <span class="selo"><img src="../../../public/marca/fivecon.png" alt=""></span>
      <div><strong>Só entra quem foi convidado.</strong><p>Esqueceu a senha? Peça um novo convite ao Natham.</p></div>
    </div>
  </aside>
</body>
</html>
